[project]
name = "spectra"
version = "0.1.0"
description = "Attack surface reconnaissance with an LLM analyst: subdomains, ports, services and NVD CVEs in a Neo4j graph, queried by a LangGraph agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.8.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langchain-groq>=1.1.2",
    "langgraph>=1.0.8",
    "neo4j>=6.1.0",
    "pydantic>=2.12.5",
    "python-nmap>=0.7.1",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Errores reales (sintaxis, nombres sin definir, imports sin usar), no estilo.
select = ["E4", "E7", "E9", "F"]
